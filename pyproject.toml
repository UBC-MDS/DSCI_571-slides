[project]
name = "dsci571-slides"
version = "0.1.0"
description = "Lecture slides for DSCI 571"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "graphviz",
    "imageio",
    "ipykernel",
    "ipython",
    "jinja2",
    "matplotlib",
    "mglearn",
    "nbclient",
    "nbformat",
    "numpy",
    "pandas",
    "scikit-learn>=1.5.1",
    "scipy",
]

[dependency-groups]
dev = ["jupyterlab"]

[tool.uv]
package = false
