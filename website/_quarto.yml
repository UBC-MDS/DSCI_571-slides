project:
  type: website
  preview:
    port: 12345
  render:
    - "./*.qmd"
    - "slides/*.qmd"
    - "lab/*.qmd"
    - "about/index.qmd"
  resources:
    - slides

website:
  title: "DSCI 571"
  description: "Slides for DSCI 571"
  site-url: https://ubc-mds.github.io/DSCI_571-slides/

  repo-url: https://github.com/UBC-MDS/DSCI_571-slides/
  repo-subdir: website

  navbar:
    title: "DSCI 571"
    left:
      - href: index.qmd
        text: Home
      - href: lecture.qmd
        text: Lectures

  page-navigation: true

  sidebar:
    - id: lecture
      contents:
        - lecture.qmd
        - lecture-01.qmd
        - lecture-02.qmd
        - lecture-03.qmd
        - lecture-04.qmd
#        - lecture-05.qmd
#        - lecture-06.qmd        
#        - lecture-07.qmd
        # - lecture-08.qmd
format:
  html:
    theme: [zephyr]
    toc: false
    lightbox: true

editor:
  render-on-save: true

execute:
  freeze: auto

filters:
  - filters/pdf-download.lua
