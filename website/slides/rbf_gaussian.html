<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RBF kernel and Gaussian</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#253047;background:#fff}body{margin:0;padding:14px}main{max-width:900px;margin:auto}.controls{display:grid;grid-template-columns:1fr 1fr;gap:20px}.control{background:#f4f7fb;border-radius:12px;padding:12px 18px}label{display:flex;justify-content:space-between;font-weight:600}input{width:100%;accent-color:#1685c5;margin-top:12px}.hint{font-size:13px;color:#526076}.stat{font-size:19px;text-align:center;margin:8px 0}svg{width:100%;height:auto;display:block} @media(max-width:550px){.controls{grid-template-columns:1fr}}
</style></head><body><main>
<svg id="plot" viewBox="0 0 800 340" role="img" aria-label="Gaussian-shaped RBF similarity curve"></svg>
<div class="controls"><div class="control"><label for="gamma">Gamma (γ) <output id="gammaValue">1.00</output></label><input id="gamma" type="range" min="0.1" max="5" step="0.1" value="1"><div class="hint">Small γ: wide bell · Large γ: narrow bell</div></div>
<div class="control"><label for="z">Reference point (z) <output id="zValue">0.0</output></label><input id="z" type="range" min="-2" max="2" step="0.1" value="0"><div class="hint">Move the centre of the similarity curve</div></div></div>
<div class="stat">Equivalent Gaussian standard deviation: <strong>σ = <span id="sigma">0.71</span></strong></div>
</main><script>
const svg=document.getElementById('plot'),g=document.getElementById('gamma'),z=document.getElementById('z');
const X=x=>70+(x+3.5)*95,Y=y=>280-230*y;
function draw(){const gamma=+g.value,center=+z.value;document.getElementById('gammaValue').textContent=gamma.toFixed(2);document.getElementById('zValue').textContent=center.toFixed(1);document.getElementById('sigma').textContent=(1/Math.sqrt(2*gamma)).toFixed(2);
let s='';for(let v=0;v<=1.001;v+=.25){s+=`<line x1="70" y1="${Y(v)}" x2="735" y2="${Y(v)}" stroke="#e2e8f0"/><text x="58" y="${Y(v)+5}" text-anchor="end" font-size="15" fill="#526076">${v.toFixed(2)}</text>`}
for(let x=-3;x<=3;x++){s+=`<text x="${X(x)}" y="307" text-anchor="middle" font-size="16" fill="#526076">${x}</text>`}
s+=`<line x1="70" y1="280" x2="735" y2="280" stroke="#64748b"/><line x1="70" y1="30" x2="70" y2="280" stroke="#64748b"/><text x="400" y="334" text-anchor="middle" font-size="17">x</text><text x="75" y="20" font-size="17">Similarity K(x, z)</text>`;
let d='';for(let i=0;i<=400;i++){let x=-3.5+7*i/400;d+=(i?'L':'M')+X(x).toFixed(2)+','+Y(Math.exp(-gamma*(x-center)**2)).toFixed(2)+' '}
s+=`<path d="${d}" fill="none" stroke="#1685c5" stroke-width="5"/><line x1="${X(center)}" y1="50" x2="${X(center)}" y2="280" stroke="#d97706" stroke-width="2" stroke-dasharray="7 7"/><circle cx="${X(center)}" cy="50" r="6" fill="#d97706"/>`;svg.innerHTML=s;}
g.addEventListener('input',draw);z.addEventListener('input',draw);draw();
</script></body></html>
